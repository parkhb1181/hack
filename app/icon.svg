<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    파비콘. app/icon.svg에 두면 Next App Router가 자동으로 <link rel="icon">을 건다.

    Mark.tsx와 같은 도형이되 껍데기를 함께 그린다 — 브라우저 탭은 배경이
    흰색일 수도 어두울 수도 있어서, 마크만 두면 한쪽에서 사라진다.
    16px까지 줄어드는 자리라 획을 안 쓰고 면으로만 만들었다.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffab8f" />
      <stop offset="1" stop-color="#ff5f8f" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#g)" />
  <circle cx="26" cy="39" r="13" fill="#fff" />
  <circle cx="43" cy="27" r="8" fill="#fff" opacity="0.62" />
</svg>
